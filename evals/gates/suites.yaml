suites:
  - suite: synthetic-foundation
    baseline_run_id:
    quality_regression_limit: 0.03
    latency_regression_limit: 0.10
    cost_regression_limit: 0.15
    gates:
      - metric: exact_match
        direction: min
        threshold: 1.0
        primary: true
  - suite: asr-final
    baseline_run_id:
    gates:
      - metric: wer
        direction: max
        threshold: 0.15
        primary: true
      - metric: failure_rate
        direction: max
        threshold: 0.0
        hard_invariant: true
  - suite: diarization
    baseline_run_id:
    gates:
      - metric: der
        direction: max
        threshold: 0.30
        primary: true
      - metric: failure_rate
        direction: max
        threshold: 0.0
        hard_invariant: true
  - suite: graph-extraction
    baseline_run_id:
    gates:
      - metric: grounding_validity
        direction: exact
        threshold: 1.0
        hard_invariant: true
      - metric: schema_validity
        direction: exact
        threshold: 1.0
        hard_invariant: true
  - suite: rag-retrieval
    baseline_run_id:
    gates:
      - metric: recall_at_5
        direction: min
        threshold: 0.80
        primary: true
  - suite: rag-answer
    baseline_run_id:
    gates:
      - metric: citation_id_validity
        direction: exact
        threshold: 1.0
        hard_invariant: true
