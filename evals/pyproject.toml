[project]
name = "tryniq-evals"
version = "1.0.0"
description = "Langfuse-native evaluation suites for Tryniq."
requires-python = ">=3.13,<3.14"
dependencies = [
    "langfuse==4.14.0",
    "numpy>=2.2,<3",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.2,<7",
    "ranx==0.3.21",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
llm = [
    "deepeval==4.1.4",
]
speech = [
    "jiwer==4.0.0",
    "pyannote.metrics==4.1",
    "soundfile>=0.13,<1",
    "whisper-normalizer>=0.1.12,<0.2",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.15,<1",
]
application = [
    "tryniq",
]

[tool.uv.sources]
tryniq = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tryniq_evals"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/eval"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
